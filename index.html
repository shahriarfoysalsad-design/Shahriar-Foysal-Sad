<style>
body{
    margin:0;

}

header{
    background:#0d6efd;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.menu-icon{
    font-size:30px;
    cursor:pointer;
}

.menu{
    display:none;
    position:absolute;
    right:10px;
    top:60px;
    background:white;
    width:180px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.menu a{
    display:block;
    padding:12px;
    text-decoration:none;
    color:black;
    border-bottom:1px solid #ddd;
}

.menu a:hover{
    background:#f2f2f2;
}
</style>
</head>

<body>

<header>
<div class="logo">Welcome to my portfolio</div>

<div class="menu-icon" onclick="toggleMenu()">☰</div>

<div class="menu" id="menu">

<a href="#">Contact</a>
<a href="#">Data</a>
</div>
</header>

<script>
function toggleMenu(){
    let menu=document.getElementById("menu");

    if(menu.style.display==="block"){
        menu.style.display="none";
    }else{
        menu.style.display="block";
    }
}
</script>

</body>
